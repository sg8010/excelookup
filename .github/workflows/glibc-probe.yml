# 探针:验证 buster(glibc 2.28) 容器内能否编译 excelookup 并产出 ≤2.28 产物
# 跑通后并入正式 CI,此文件删除
name: glibc-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:buster
    steps:
      - uses: actions/checkout@v4

      - name: 容器内环境
        run: |
          cat /etc/os-release | head -2
          ldd --version | head -1
          uname -m
          whoami

      - name: 切到 archive 源 (buster 已 EOL)
        run: |
          printf '%s\n' \
            'deb http://archive.debian.org/debian/ buster main' \
            'deb http://archive.debian.org/debian/ buster-updates main' \
            'deb http://archive.debian.org/debian-security/ buster/updates main' \
            > /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update

      - name: 装 rustup + gcc (buster 内)
        run: |
          apt-get install -y --no-install-recommends curl ca-certificates gcc libc6-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: 编译 (release)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release

      - name: 检查产物 glibc 需求
        run: |
          echo "=== 文件类型 ==="
          readelf -h target/release/excelookup | grep -E "Class|Machine"
          echo "=== 需求的最高 glibc 符号版本 ==="
          objdump -T target/release/excelookup 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -5
          echo "=== 最大版本号 ==="
          objdump -T target/release/excelookup 2>/dev/null | grep -oE 'GLIBC_2\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1
          echo "=== NEEDED ==="
          readelf -d target/release/excelookup | grep NEEDED | awk '{print $NF}'

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excelookup-buster-arm64
          path: target/release/excelookup
