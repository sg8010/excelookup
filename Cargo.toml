[package]
name = "excelookup"
version = "0.1.0"
edition = "2024"

[lib]
name = "excelookup_lib"
path = "src/lib.rs"

[[bin]]
name = "excelookup"
path = "src/main.rs"

[dependencies]
# Linux 目标仅需 X11 + glow(OpenGL) 渲染;关 default 去掉 wayland/wgpu/accesskit。
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "links", "glow", "x11"] }
egui_extras = "0.36"
calamine = "0.36"
rust_xlsxwriter = "0.99"
# 目标平台是 X11 + GTK3;直接使用 GTK3 文件对话框,不依赖 Portal/D-Bus/Zenity。
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
anyhow = "1"
