[package]
name = "excelookup"
version = "0.1.0"
edition = "2024"
default-run = "excelookup"

[lib]
name = "excelookup_lib"
path = "src/lib.rs"

[[bin]]
name = "excelookup"
path = "src/main.rs"

[dependencies]
# Linux 目标仅需 X11 + glow(OpenGL) 渲染;关 default 去掉 wayland/wgpu/accesskit。
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "links", "glow", "x11"] }
egui_extras = "0.36"
calamine = "0.36"
rust_xlsxwriter = "0.99"
anyhow = "1"

# Linux 目标不使用 rfd:它靠 XDG Desktop Portal,Portal 缺失时会回退成调用
# `zenity` 外部进程,精简桌面/无桌面环境上会直接没反应。Linux 改用内置的 egui
# 文件对话框(src/file_dialog.rs + excelookup_lib::filebrowser),只依赖 std::fs。
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.17", default-features = false }
