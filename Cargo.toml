[package]
name = "excelookup"
version = "0.1.0"
edition = "2024"
default-run = "excelookup"

[lib]
name = "excelookup_lib"
path = "src/lib.rs"

[[bin]]
name = "excelookup"
path = "src/main.rs"

[dependencies]
# Linux 目标仅需 X11 + glow(OpenGL) 渲染;关 default 去掉 wayland/wgpu/accesskit。
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "links", "glow", "x11"] }
egui_extras = "0.36"
calamine = "0.36"
rust_xlsxwriter = "0.99"
# Linux 使用 XDG Desktop Portal;Portal 不可用时由 rfd 回退到 Zenity。
# 不把 GTK3 直接链接进主程序,避免目标机 GTK/GLX 驱动冲突。
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
anyhow = "1"
